name: flexikeys
description: FlexiKeys - Small steps. Big progress.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  audioplayers: ^6.0.0
  path_provider: ^2.1.0
  http: ^1.2.0
  go_router: ^14.0.0
  flutter_riverpod: ^2.5.1
  fl_chart: ^1.2.0
  flutter_secure_storage: ^9.2.2
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  image_picker: ^1.1.2
  record: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  path_provider_platform_interface: ^2.1.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.9

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "00_02_44.png"
  remove_alpha_ios: true
  web:
    generate: false

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/
    - assets/images/
    - assets/fonts/
    - shared/aac/
    # Flutter's directory-style asset declaration is NOT recursive — a
    # nested subfolder like shared/aac/audio/uz/ is invisible to the asset
    # bundler unless separately declared, proven empirically (a clean
    # `flutter test` rebuild produced zero files under shared/aac/audio/
    # despite shared/aac/ being declared above). shared/aac/audio/en/ and
    # .../ru/ aren't listed here yet because those directories don't exist
    # on disk (tools/generate_aac_audio.py hasn't been run for them) —
    # declaring a nonexistent directory fails the Flutter build. Add them
    # here once they're populated.
    - shared/aac/audio/uz/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900