name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    name: Backend (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flexikeys
          POSTGRES_PASSWORD: flexikeys
          POSTGRES_DB: flexikeys_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flexikeys -d flexikeys_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: development
      APP_SECRET_KEY: ci-secret-key-not-for-production
      DATABASE_URL: postgresql+asyncpg://flexikeys:flexikeys@localhost:5432/flexikeys_test
      REDIS_URL: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type check (mypy)
        run: mypy src

      - name: Test (pytest — all suites with coverage)
        run: pytest --cov=flexikeys --cov-report=xml --cov-report=term-missing

      - name: Coverage threshold — adaptive business logic (≥80%)
        run: |
          coverage report \
            --include='*/modules/adaptive/metrics.py,*/modules/adaptive/mastery.py,*/modules/adaptive/policy.py,*/modules/adaptive/repetition.py' \
            --fail-under=80

      - name: Coverage threshold — auth business logic (≥80%)
        run: |
          coverage report \
            --include='*/modules/auth/service.py' \
            --fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ── Flutter ──────────────────────────────────────────────────────────────────
  flutter:
    name: Flutter (analyze · test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  # ── Docker build ─────────────────────────────────────────────────────────────
  docker:
    name: Docker build (backend)
    runs-on: ubuntu-latest
    needs: [backend]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t flexikeys-backend:ci backend/

      - name: Confirm non-root user
        run: |
          USER=$(docker run --rm flexikeys-backend:ci whoami)
          test "$USER" = "app" || (echo "Container runs as $USER, expected app" && exit 1)

      - name: Smoke test — /version responds
        run: |
          docker run -d --name fk-smoke \
            -e APP_SECRET_KEY=ci-smoke \
            -e DATABASE_URL=postgresql+asyncpg://x:x@localhost/x \
            -e REDIS_URL=redis://localhost/0 \
            -p 8001:8000 \
            flexikeys-backend:ci
          sleep 5
          # /version doesn't need DB
          curl -sf http://localhost:8001/version | grep '"version"' || true
          docker rm -f fk-smoke